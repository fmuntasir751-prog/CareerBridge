databases:
  - name: careerbridge-db
    plan: free
    region: singapore
    databaseName: careerbridge
    user: careerbridge

services:
  - type: web
    name: careerbridge-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >-
      gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerbridge-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"