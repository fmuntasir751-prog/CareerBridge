services:
  - type: web
    name: careerbridge-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >-
    gunicorn config.wsgi:application --timeout 90
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"
        services:
  - type: web
    name: careerbridge-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend

    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate

    startCommand: >-
      gunicorn config.wsgi:application --timeout 90

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"

      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"